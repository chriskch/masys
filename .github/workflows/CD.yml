name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: masys-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, "masys"]
    env:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy
        run: pm2 restart masys --update-env
