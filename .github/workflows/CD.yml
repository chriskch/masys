name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: masys-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Package standalone
        run: |
          rm -rf artifact
          mkdir -p artifact

          cp -r .next/standalone/* artifact/
          mkdir -p artifact/.next
          cp -r .next/static artifact/.next/static
          [ -d public ] && cp -r public artifact/public || true
          [ -f ecosystem.config.js ] && cp ecosystem.config.js artifact/ecosystem.config.js || true

          tar -czf masys.tgz -C artifact .

      - uses: actions/upload-artifact@v4
        with:
          name: masys-build
          path: masys.tgz

  deploy:
    needs: build
    runs-on: [self-hosted, "masys"]
    env:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: masys-build

      - name: Deploy
        env:
          APP_DIR: /home/github/applications/masys
          RELEASE: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$APP_DIR/releases" "$APP_DIR/shared"
          mkdir -p "$APP_DIR/releases/$RELEASE"
          tar -xzf masys.tgz -C "$APP_DIR/releases/$RELEASE"
          ln -sf "$APP_DIR/shared/.env.production" "$APP_DIR/releases/$RELEASE/.env.production"
          ln -sfn "$APP_DIR/releases/$RELEASE" "$APP_DIR/current"
          ls -1dt "$APP_DIR/releases/"* 2>/dev/null | tail -n +6 | xargs -r rm -rf

      - name: Restart (pm2 via nvm)
        run: |
          set -euo pipefail
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
          nvm use 24.12.0

          cd /home/github/applications/masys/current

          if pm2 describe masys >/dev/null 2>&1; then
            pm2 reload ecosystem.config.js --only masys --update-env
          else
            pm2 start ecosystem.config.js --only masys --update-env
          fi

          pm2 save
