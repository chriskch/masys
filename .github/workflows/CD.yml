name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: masys-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Package standalone
        run: |
          mkdir -p artifact
          cp -r .next/standalone artifact/standalone
          cp -r .next/static artifact/static
          [ -d public ] && cp -r public artifact/public || true
          # optional: keep ecosystem config with the artifact
          [ -f ecosystem.config.js ] && cp ecosystem.config.js artifact/ || true
          tar -czf masys.tgz -C artifact .

      - uses: actions/upload-artifact@v4
        with:
          name: masys-build
          path: masys.tgz

  deploy:
    runs-on: [self-hosted, "masys"]
    env:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: masys-build

      - name: Deploy files
        run: |
          sudo mkdir -p /var/www/masys
          sudo tar -xzf masys.tgz -C /var/www/masys
          sudo chown -R github:github /var/www/masys

      - name: Restart (zero-downtime reload if possible)
        run: pm2 reload masys --update-env
